<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="adminPanel" class="admin-panel">
        <h1>Admin Dashboard</h1>
        <p>Willkommen im Admin-Bereich!</p>

        <div id="userManagementBox" style="display: none;">
            <h2>Benutzerverwaltung</h2>
            <button id="manageUsersBtn">Benutzer verwalten</button>
        </div>

        <div>
            <h2>Passwort ändern</h2>
            <button id="changePasswordBtn">Passwort ändern</button>
        </div>

        <div>
            <h2>Inhalte</h2>
            <button id="manage-content">Inhalte verwalten</button>
        </div>

        <button id="logoutBtn">Logout</button>
    </div>

    <div id="content-modal" style="display: none;">
        <textarea id="content-editor" rows="10" cols="50"></textarea>
        <button id="save-content">Speichern</button>
        <button id="close-modal">Schließen</button>
    </div>

    <script src="js/admin.js"></script>
</body>
</html>
