<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="admin-sidebar">
        <h2>Superadmin Panel</h2>
        <button id="add-section">Add Section</button>
        <button id="add-main-menu-item">Add Main Menu Item</button>
        <button id="manage-content">Inhalte verwalten</button>
        <ul id="sections-list">
            <!-- Dynamically populated sections -->
        </ul>
    </div>
    <div id="content">
        <h1>Welcome, Superadmin</h1>
        <p>Select a section to edit its content.</p>
    </div>
    <div id="content-modal" style="display: none;">
        <textarea id="content-editor" rows="10" cols="50"></textarea>
        <button id="save-content">Speichern</button>
        <button id="close-modal">Schließen</button>
    </div>
    <script src="js/admin.js"></script>
</body>
</html>
